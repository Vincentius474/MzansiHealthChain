[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
local = "http://127.0.0.1:8545"
fuji = "${AVALANCHE_FUJI_RPC_URL}"
mainnet = "https://api.avax.network/ext/bc/C/rpc"
